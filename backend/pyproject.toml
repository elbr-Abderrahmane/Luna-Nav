[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunanav-backend"
version = "1.0.0"
description = "LunaNav — Lunar Landing Site Navigator Full-Stack Backend & Scientific Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "affine>=2.4.0",
    "rasterio>=1.3.0",
    "spiceypy>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
