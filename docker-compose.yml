services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LUNA_ENV=development
      - LUNA_CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./data:/workspace/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_USE_FIXTURES=false
    depends_on:
      - backend

