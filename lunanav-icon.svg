<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0f2342" />
      <stop offset="100%" stop-color="#040711" />
    </radialGradient>
    <linearGradient id="moonSurface" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f8ff" />
      <stop offset="55%" stop-color="#b8cce8" />
      <stop offset="100%" stop-color="#526b94" />
    </linearGradient>
    <linearGradient id="orbitCyan" x1="6" y1="44" x2="58" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#33f0d5" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#33f0d5" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#5aa8ff" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Deep space rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGlow)" stroke="#33f0d5" stroke-width="2" stroke-opacity="0.45" />

  <!-- Back half of orbital trajectory -->
  <path d="M 10 38 A 25 10 0 0 1 54 26" stroke="url(#orbitCyan)" stroke-width="2" stroke-dasharray="3 3" transform="rotate(-22 32 32)" />

  <!-- Golden Sun flare at top-right limb -->
  <circle cx="46" cy="17" r="4.5" fill="#ffd166" />
  <circle cx="46" cy="17" r="8" fill="#ffd166" fill-opacity="0.22" />

  <!-- Main Lunar Sphere -->
  <circle cx="31" cy="33" r="16" fill="url(#moonSurface)" />

  <!-- Lunar Terminator shadow (night side) -->
  <path d="M 31 17 A 16 16 0 0 0 31 49 A 10.5 16 0 0 1 31 17 Z" fill="#081124" fill-opacity="0.72" />

  <!-- Subtle Lunar Craters -->
  <circle cx="36" cy="27" r="2.6" fill="#7d95ba" fill-opacity="0.55" />
  <circle cx="40" cy="35" r="1.8" fill="#7d95ba" fill-opacity="0.5" />
  <circle cx="33" cy="39" r="3.1" fill="#6b83a8" fill-opacity="0.5" />

  <!-- Front half of orbital trajectory -->
  <path d="M 54 26 A 25 10 0 0 1 10 38" stroke="url(#orbitCyan)" stroke-width="2.5" stroke-linecap="round" transform="rotate(-22 32 32)" />

  <!-- South Pole Landing Beacon Pin (#33f0d5) -->
  <circle cx="31" cy="49" r="6.5" fill="#33f0d5" fill-opacity="0.28" />
  <circle cx="31" cy="49" r="3.4" fill="#33f0d5" stroke="#040711" stroke-width="1.4" />
</svg>
